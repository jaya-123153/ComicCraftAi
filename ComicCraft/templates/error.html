<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ComicCraft Error
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<main class="container narrow">

    <section class="card center">

        <div class="badge">
            ERROR
        </div>

        <h1>
            Comic Generation Failed
        </h1>

        <p>
            {{ error }}
        </p>

        <a
            class="secondary"
            href="/"
        >
            Back to ComicCraft
        </a>

    </section>

</main>

</body>
</html>
