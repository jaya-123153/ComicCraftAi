<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ComicCraft - AI Comic Creator</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body class="hero-bg">

<main class="container narrow">

    <section class="card hero-card">

        <div class="badge">
            AI COMIC CREATOR
        </div>

        <h1>
            ComicCraft
        </h1>

        <p class="lead">
            Turn your story idea into a
            five-panel AI comic with
            narration, dialogue,
            illustrations and PDF export.
        </p>

        <form
            action="/generate"
            method="post"
            class="form-grid"
        >

            <label>
                Story Prompt

                <textarea
                    name="story_prompt"
                    required
                    maxlength="2000"
                    placeholder="A brave fox exploring an enchanted forest..."
                ></textarea>
            </label>

            <label>
                Main Character Name

                <input
                    type="text"
                    name="character_name"
                    required
                    maxlength="100"
                    placeholder="Lumi"
                >
            </label>

            <label>
                Setting

                <select name="setting">

                    <option>
                        Forest
                    </option>

                    <option>
                        School
                    </option>

                    <option>
                        City
                    </option>

                    <option>
                        Space
                    </option>

                    <option>
                        Enchanted World
                    </option>

                </select>

            </label>

            <label>
                Story Tone

                <select name="tone">

                    <option>
                        Light-hearted
                    </option>

                    <option>
                        Funny
                    </option>

                    <option>
                        Dramatic
                    </option>

                    <option>
                        Poetic
                    </option>

                    <option>
                        Adventurous
                    </option>

                </select>

            </label>

            <label>
                Art Style

                <select name="art_style">

                    <option>
                        Comic Book
                    </option>

                    <option>
                        Anime
                    </option>

                    <option>
                        Pixel Art
                    </option>

                    <option>
                        Realistic
                    </option>

                </select>

            </label>

            <button
                type="submit"
                class="primary"
            >
                Create My Comic ✨
            </button>

        </form>

    </section>

</main>

</body>
</html>
